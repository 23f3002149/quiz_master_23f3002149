<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz View</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            margin: 0;
        }
        .container {
            border: 2px solid #fff;
            border-radius: 15px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.9);
            text-align: center;
            box-shadow: 5px 5px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        .container h3 {
            color: #0073e6;
            font-size: 22px;
            margin-bottom: 15px;
        }
        .container label {
            display: block;
            font-weight: 600;
            margin: 10px 0 5px;
            color: #333;
        }
        .input-box {
            display: inline-block;
            padding: 8px 12px;
            border: 2px solid #0073e6;
            border-radius: 8px;
            background-color: #e3f2fd;
            min-width: 120px;
            font-weight: bold;
            color: #0056b3;
        }
        .button {
            background: #0073e6;
            color: white;
            border: none;
            padding: 10px 25px;
            margin-top: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .button:hover {
            background: #005bb5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>View the Quiz</h3>
        <label>Chapter ID:</label>
        <span class="input-box">{{chapter_id}}</span>
        <label>Subject:</label>
        <span class="input-box">{{subject_name}}</span>
        <label>Chapter:</label>
        <span class="input-box">{{quiz.chapter_name}}</span>
        <label>Number of Questions:</label>
        <span class="input-box">{{question_counts[quiz.chapter_id]}}</span>
        <label>Scheduled Date:</label>
        <span class="input-box">{{quiz.date_quiz}}</span>
        <label>Duration (hh:mm):</label>
        <span class="input-box">{{quiz.time_duration}}</span>
        <br>
        </a><button class="button" onclick="window.location.href = '/user_home/{{user}}';"  >Close</button>
    </div>
</body>
</html>
