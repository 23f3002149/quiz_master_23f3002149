<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #f1f1f1;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .header a {
            margin: 0 10px;
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }

        .header a:hover {
            text-decoration: underline;
        }

        .header input[type="text"] {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .welcome {
            font-weight: bold;
            color: #007bff;
        }

        .dashboard {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border: 2px solid #ccc;
            border-radius: 10px;
            padding: 20px;
        }

        .dashboard h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ff8000;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border: 1px solid #ddd;
        }

        th {
            background-color: #f1f1f1;
        }

        .action-buttons {
            display: flex;
            gap: 5px;
        }

        .view-button {
            padding: 5px 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .view-button:hover {
            opacity: 0.9;
        }

        .start-button {
            padding: 5px 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .start-button:hover {
            opacity: 0.9;
        }

        .ellipsis {
            text-align: center;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <a href="/user_home/{{user}}">Home</a>
            <a href="/score/{{user}}">Scores</a>
            <a href="/user_summary/{{user}}">Summary</a>
            <a href="/">Logout</a>
        </div>
        <form action="#" method="post">
            <input type="search" name="search" placeholder="Search">
            <button type="button">Search</button>
        </form>
        <div class="welcome">Welcome {{user}}</div>
    </div>

    <div class="dashboard">
        <h2>Upcoming Quizes</h2>
        <table>
      
            <thead>
                <tr>
                    <th>Chapter_name</th>
                    <th>No. of Questions</th>
                    <th>Date</th>
                    <th>Duration (hh:mm)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for quiz in quizes %}
                <tr>
                    <td>{{quiz.chapter_name}}</td>
                    <td>{{question_counts[quiz.chapter_id]}}</td>
                    <td>{{quiz.date_quiz}}</td>
                    <td>{{quiz.time_duration}}</td>
                    <td>
                        <div class="action-buttons">
                            <a href="/view_details/{{quiz.chapter_id}}/{{user}}"><button class="view-button">View</button></a> 
                            <a href="/start_test/{{quiz.quiz_id}}/{{user}}"><button class="start-button">Start</button></a>
                        </div>
                    </td>
                </tr>
                {% endfor %}
               
                <tr>
                    <td colspan="5" class="ellipsis">...</td>
                </tr>
            </tbody>
            
        </table>
    </div>
</body>
</html>
