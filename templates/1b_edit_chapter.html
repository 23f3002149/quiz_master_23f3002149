<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Chapter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
        }
        .container h1 {
            text-align: center;
            color: orange;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }
        .buttons button {
            width: 45%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .buttons button.save {
            background-color: #4CAF50;
            color: white;
        }
        .buttons button.cancel {
            background-color: #4949f8;
            color: white;
        }
        .buttons button.delete {
            background-color: #fb1504;
            color: white;
        }
        .note {
            color: red;
            font-style: italic;
            margin-top: 15px;
            text-align: center;
        }
        .message {
            color: rgb(119, 7, 7);
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Edit Chapter</h1>
        <form action="/edit_only_chapter/{{chapter.chapter_id}}" method="POST">



            <label for="subject_selection">Subject</label>
            <input type="int" id="subject_selection" name="subject_id" value="{{chapter.subject_id}}" readonly >

            <label for="name">Name:</label>
            <input type="text" id="name" name="chapter_name" value="{{chapter.chapter_name}}">
            
            <label for="description">Description:</label>
            <textarea id="description" name="description" value="{{chapter.description}}"></textarea>
            
            <!-- <div class="note">Note: May include more input fields...</div> -->

            
            <div class="buttons">
                <button type="submit" class="save">Save</button>
                <button type="button" class="delete" onclick="window.location.href='/delete_chapter/{{chapter.chapter_id}}'" >Delete  </button>
                <button type="button" class="cancel" onclick="window.location.href='/admin_home'" >Cancel</button>
            </div>
        </form>
        <div class="message">{{msg}}</div>
    </div>
</body>
</html>
