<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            border: 2px solid #000;
            border-radius: 10px;
            padding: 20px 40px;
            background-color: #fff;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        h2 {
            color: #337ab7;
            margin-bottom: 5px;
        }
        .register-text {
            color: orange;
            font-weight: bold;
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
            color: #337ab7;
            display: inline-block;
            width: 150px;
            text-align: right;
            margin-right: 10px;
        }
        input {
            border: 2px solid #337ab7;
            border-radius: 5px;
            padding: 5px;
            width: 200px;
            margin-bottom: 10px;
            outline: none;
        }
        .btn-submit {
            margin-top: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-submit:hover {
            background-color: #45a049;
        }
        .existing-user {
            margin-left: 20px;
            color: red;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }
        .existing-user:hover {
            text-decoration: underline;
        }
        .message {
            margin-top: 20px;
            color: maroon;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Welcome to Quiz Master</h2>
        <p class="register-text">Registration</p>

        <form action="/new_registration" method="post">
            <label for="first">User name (E-mail):</label>
            <input id="first" name="email_username" type="email" required><br><!--here the name should be same as what is present in database table-->

            <label for="second">Password:</label>
            <input id="second" name="password" type="password" required><br>

            <label for="third">Full name:</label>
            <input id="third" name="Full_name" type="text" required><br>

            <label for="fourth">Qualification:</label>
            <input id="fourth" name="qualification" type="text" required><br>

            <label for="fifth">Date of Birth:</label>
            <input id="fifth" name="date_of_birth" type="date" required><br>

            <button type="submit" class="btn-submit">Submit</button>
            <a href="/" class="existing-user">Existing user?</a>
        </form>
        <div class="message">{{msg}}</div>
    </div>

</body>
</html>
