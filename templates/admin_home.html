<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #f3f3f3;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ccc;
        }
        .header a {
            text-decoration: none;
            color: green;
            font-weight: bold;
            margin-right: 15px;
        }
        .header .search-box {
            padding: 5px;
            border: 2px solid #000;
            border-radius: 5px;
            outline: none;
        }
        .header .admin-text {
            color: blue;
            font-weight: bold;
        }
        .content {
            padding: 20px;
            text-align: center;
        }
        .subject-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .subject-box {
            border: 2px solid #000;
            border-radius: 10px;
            padding: 20px;
            background-color: #fff;
            width: 300px;
            text-align: left;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
        }
        .subject-box h3 {
            text-align: center;
            color: #337ab7;
        }
        .subject-box table {
            width: 100%;
            border-collapse: collapse;
        }
        .subject-box th {
            background-color: #ddd;
            color: #337ab7;
            padding: 5px;
            text-align: left;
        }
        .subject-box td {
            padding: 5px;
            border-bottom: 1px solid #ccc;
        }
        .btn-chapter {
            margin-top: 10px;
            background-color: #ff8080;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            display: block;
            width: 100%;
            text-align: center;
        }
        .all-subjects {
            margin-top: 20px;
            font-size: 18px;
            color: blue;
            text-decoration: none;
        }
        .add-btn {
            display: inline-block;
            width: 40px;
            height: 40px;
            background-color: orange;
            border-radius: 50%;
            text-align: center;
            line-height: 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <a href="/admin_home">Home</a> |
            <a href="/admin_quiz">Quiz</a> |
            <a href="#">Summary</a> |
            <a href="/">Logout</a>
        </div>
        <input type="text" class="search-box" placeholder="Search">
        <div class="admin-text">Welcome {{admin}}</div>
    </div>

<div class="content">
    
    <div class="subject-container">
        {%if subjects%}
        {% for subject in subjects %}
        <div class="subject-box">
            
            <h3>{{subject.subject_name}}</h3>
            <table>
                <tr>
                    <th>Chapter name</th>
                    <th># of Questions</th>
                    <th>Action</th>
                </tr>
                <tr>
                    <td>Force</td>
                    <td>xxxxxx</td>
                    <td>Edit/Delete</td>
                </tr>
                <tr>
                    <td>EMF</td>
                    <td>xxxxxx</td>
                    <td>Edit/Delete</td>
                </tr>
            </table>
            <a href="/new_chapter"> <button class="btn-chapter">+ Chapter</button></a>
         
        </div> 

        {% endfor %}
        {%else%}
        <h2>No subjects found</h2>
       
        {%endif%}
    </div>
    </div>

    <a href="/new_subject" class="all-subjects">All subjects here ...<div class="add-btn">+</div></a>
    
    
</div>
