<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .contain {
            border: 2px solid #000;
            border-radius: 10px;
            padding: 20px 40px;
            background-color: #fff;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        h2 {
            color: #337ab7;
            margin-bottom: 5px;
        }
        .login-text {
            color: orange;
            font-weight: bold;
        }
        label {
            font-weight: bold;
            color: #337ab7;
            display: inline-block;
            margin-top: 10px;
        }
        input {
            border: 2px solid #337ab7;
            border-radius: 5px;
            padding: 5px;
            width: 200px;
            outline: none;
        }
        .btn-login {
            margin-top: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-login:hover {
            background-color: #45a049;
        }
        .create-account {
            margin-left: 20px;
            color: red;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }
        .create-account:hover {
            text-decoration: underline;
        }
        .messag {
            margin-top: 20px;
            color: maroon;
        }
        .message {
            margin-top: 20px;
            color: rgb(109, 179, 4);
        }
    </style>
</head>
<body>

    <div class="contain">
        <h2>Welcome to Quiz Master</h2>
        <p class="login-text">Login</p>

        <form action="/" method="post"><!--action means where(to which route) to send the data of the form and method is post --> 
            <label for="first">Username (E-mail) :</label>
            <input type="email" required id="first" name="username"><br>

            <label for="second">Password :</label>
            <input name="password" id="second" type="password" required><br>

            <button type="submit" class="btn-login">Login</button>
            <a href="/new_registration" class="create-account">Create new user?</a>
        </form>
        <div class="messag">{{msg}}</div>
        <div class="message">{{mesg}}</div>
    </div>

</body>
</html>
