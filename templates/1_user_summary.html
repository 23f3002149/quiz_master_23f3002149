<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/static/css/1_user_summary.css">
</head>
<body>
   

 
    <div class="header">
        <div>
            <a href="/user_home/{{user_id}}">Home</a>
            <a href="/score/{{user_id}}">Scores</a>
            <a href="/user_summary/{{user_id}}">Summary</a>
            <a href="/">Logout</a>
        </div>
        
        <div class="welcome">Welcome {{user}}</div>
    </div>

    <div class="dashboard">
   
        <h2>User Summary</h2>
        <p>Total No. of Times Quizzes Attempted: {{ total_quizzes }}</p>
        <p>Average Score: {{ avg_score }}</p>
    
        <h2>Performance Over Time</h2>
        <img src="/static/images/user_line_chart.png" alt="Performance Over Time">

        <h2>Correct vs Incorrect Answers</h2>
        <img src="/static/images/user_pie_chart.png" alt="Correct vs Incorrect Answers">

              
    </div>

    
</body>
</html>
