<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Quiz Form</title>
    <link rel="stylesheet" href="../static/2b_add_newquiz.css">
</head>
<body>
    <div class="form-container">
        <div class="form-header">New Quiz</div>
        <form action="/add_newquiz" method="post">
        <div class="form-group">
            <!-- <label for="chapter-id">Chapter ID:</label>
            <input type="text" id="chapter-id" name="chapter_id"> -->
            <label for="first">Select chapter for quiz :</label>
            <select name="chapter_id" id="first">
            <option value="" disabled selected> select chapter</option>
            {% for chapter in chapter %}    
            <option value="{{chapter.chapter_id}}">{{chapter.chapter_name}}</option>
            {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="date">Date:</label>
            <input type="date" id="date" name="date_quiz" placeholder="dd/mm/yyyy">
        </div>

        <div class="form-group">
            <label for="duration">Duration:</label>
            <input type="time" id="duration" name="time_duration" placeholder="hh:mm">
        </div>

        <!-- <div class="note">Note: May include more input fields...</div> -->

        <div class="buttons">
            <button class="save" type="submit">Save</button>
            <button class="cancel" type="button" onclick="window.location.href='/admin_quiz'">Cancel</button>
        </div>
        <div color="red">{{msg}}</div>
        </form>
    </div>
</body>
</html>
