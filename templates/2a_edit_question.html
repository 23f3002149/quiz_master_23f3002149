<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Question Form</title>
    <link rel="stylesheet" href="/static/css/2a_edit_question.css">
</head>
<body>
    <form action="/edit_question/{{question.question_id}}/{{chapter_id}}/{{quiz_id}}" method="post">
    <div class="form-container">
        <div class="form-header">New Question</div>
        
        <div class="form-group">
            <label for="chapter-id">Chapter ID:</label>
            <input type="text" id="chapter-id" name="chapter-id" value="{{chapter_id}}" readonly>
        </div>

        <div class="form-group">
            <label for="question-title">Question Title:</label>
            <input type="text" id="question-title" name="question_title" value="{{question.question_title}}" required>
        </div>

        <div class="form-group">
            <label for="question-statement">Question Statement:</label>
            <input type="text" id="question-statement" name="question" value="{{question.question}}" required>
        </div>

        <div class="form-header">Single Option Correct</div>
        
        <div class="options">
            <label for="option1">Option 1:</label>
            <input type="text" id="option1" name="option_a" value="{{question.option_a}}" required>
        </div>

        <div class="options">
            <label for="option2">Option 2:</label>
            <input type="text" id="option2" name="option_b" value="{{question.option_b}}" required>
        </div>

        <div class="options">
            <label for="option3">Option 3:</label>
            <input type="text" id="option3" name="option_c" value="{{question.option_c}}" required>
        </div>

        <div class="options">
            <label for="option4">Option 4:</label>
            <input type="text" id="option4" name="option_d" value="{{question.option_d}}" required>
        </div>

        <div class="form-group">
            <label for="correct-option">Correct Option:</label>
            <input type="text" id="correct-option" name="correct_option" value="{{question.correct_option}}" required>
        </div>

        <div class="buttons">
            <button class="save" button="submit">Save and Next</button>
            <button type="button" class="delete" onclick="window.location.href='/delete_question/{{question.question_id}}'" >Delete  </button>  <!--now i want to redirect it to  the route which have commands to delete the question--> 
            <button class="close" type="button" onclick="window.location.href='/admin_quiz'">Close</button>
        </div>
        <div>{{msg}}</div>
    </div>
    </form>
</body>
</html>
