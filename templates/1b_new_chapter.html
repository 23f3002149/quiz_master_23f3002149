<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Chapter</title>
    <link rel="stylesheet" href="../static/1b_new_chapter.css">
</head>
<body>
    <div class="container">
        <h1>New Chapter</h1>
        <form action="/new_chapter/{{subject_id}}" method="POST">



            <label for="subject_selection">Subject</label>
            <input type="int" id="subject_selection" name="subject_id" value="{{subject_id}}" readonly >

            <label for="name">Name:</label>
            <input type="text" id="name" name="chapter_name" placeholder="Enter name">
            
            <label for="description">Description:</label>
            <textarea id="description" name="description" placeholder="Enter description"></textarea>
            
            <!-- <div class="note">Note: May include more input fields...</div> -->

            
            <div class="buttons">
                <button type="submit" class="save">Save</button>
                <button type="button" class="cancel" onclick="window.location.href='/admin_home'" >Cancel</button>
            </div>
        </form>
        <div class="message">{{msg}}</div>
    </div>
</body>
</html>
